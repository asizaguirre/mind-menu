version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mindmenu-admin:
    build:
      context: ./mindmenu-admin
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/railway
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/railway
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  mindmenu-frontend:
    build:
      context: ./mindmenu-frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - mindmenu-admin

volumes:
  postgres_data:
